name: CI - Velua Web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# El token del workflow solo puede leer el repo: no puede escribir, comentar ni
# publicar nada. Si una dependencia maliciosa corriera acá, no tendría permisos.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build (incluye tsc -b)
        run: npm run build